name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on every PR, including stacked PRs whose base is another feature
    # branch (e.g. m4-sandbox -> m3-policy-engine -> main).
    branches: ["**"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: the action installs the version pinned in
      # rust-toolchain.toml (#40), so CI and local runs agree.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install bubblewrap (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # cargo-deny was parked on an invalid deny.toml (#41), so known RUSTSEC
  # advisories, licences and non-crates.io sources went unchecked. The file is
  # now schema v2, and this job runs the advisory, licence, source and ban
  # checks on every pull request.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
