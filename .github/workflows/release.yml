name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag
        run: bash .github/scripts/release-bump.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
