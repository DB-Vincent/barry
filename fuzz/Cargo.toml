[package]
name = "barry-fuzz"
# Its own version, unrelated to the released CLI: this crate is never
# published, and the release script must leave it alone.
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.154"
barry-llm = { path = "../crates/llm", features = ["fuzzing"] }
barry-policy = { path = "../crates/policy" }

[[bin]]
name = "sse_stream"
path = "fuzz_targets/sse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_call_chunks"
path = "fuzz_targets/tool_call_chunks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonicalise"
path = "fuzz_targets/canonicalise.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check_bash"
path = "fuzz_targets/check_bash.rs"
test = false
doc = false
bench = false
