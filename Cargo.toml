[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/llm",
    "crates/policy",
    "crates/sandbox",
    "crates/core",
    "crates/cli",
    "crates/testkit",
]

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync"] }
toml = "1.2.1"
thiserror = "2.0.21"
tempfile = "3.27.0"
bytes = "1.10.0"
futures = "0.3.34"
url = "2.5.8"
tokio-util = "0.7.20"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
time = { version = "0.3.55", features = ["formatting"] }
sha2 = "0.11.1"
regex = "1.13.1"
uuid = { version = "1.29.2", features = ["v4"] }
rustyline = "19.0.0"
libc = "0.2.191"
seccompiler = "0.5.0"
barry-protocol = { path = "crates/protocol" }
barry-llm = { path = "crates/llm" }
barry-policy = { path = "crates/policy" }
barry-sandbox = { path = "crates/sandbox" }
barry-core = { path = "crates/core" }
barry-testkit = { path = "crates/testkit" }

# Dev-dependencies
assert_cmd = "2.2.2"
predicates = "3.1.4"
wiremock = "0.6.5"
insta = "1.49.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
