[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/llm",
    "crates/policy",
    "crates/sandbox",
    "crates/core",
    "crates/cli",
]

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
toml = { version = "=1.2.1" }
thiserror = { version = "=2.0.21" }
tempfile = { version = "=3.27.0" }
bytes = { version = "=1.10.0" }
futures = { version = "=0.3.34" }
url = { version = "=2.5.8" }
tokio-util = { version = "=0.7.20" }
barry-protocol = { path = "crates/protocol" }
barry-llm = { path = "crates/llm" }
barry-policy = { path = "crates/policy" }
barry-sandbox = { path = "crates/sandbox" }
barry-core = { path = "crates/core" }

# Dev-dependencies
assert_cmd = { version = "=2.2.2" }
predicates = { version = "=3.1.4" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
