[package]
name = "barry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
barry-protocol = { workspace = true }
barry-policy = { workspace = true }
barry-core = { workspace = true }
barry-llm = { workspace = true }
barry-sandbox = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time"] }
rustyline = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
barry-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }
