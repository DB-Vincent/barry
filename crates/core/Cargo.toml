[package]
name = "barry-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
barry-protocol = { workspace = true }
barry-llm = { workspace = true }
barry-policy = { workspace = true }
barry-sandbox = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
rustix = { workspace = true }
time = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "signal", "sync"] }

[dev-dependencies]
barry-testkit = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
